<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our School - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--gradient-bg); min-height: 100vh;">

  <header>
    <div class="logo">🏫 Our School</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <div class="form-box">
    <h2 style="text-align: center; margin-bottom: 8px; color: var(--dark-blue);">Login to Your Account</h2>
    <p style="text-align: center; font-size: 13px; color: var(--gray-text); margin-bottom: 25px;">Enter your details to access your account</p>

    <form>
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" class="form-control" placeholder="Enter your email or username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>
    
    <p style="text-align: center; font-size: 12px; margin-top: 20px; color: var(--gray-text);">
      Don't have an account? <a href="register.html" style="color: var(--primary-color); font-weight: bold;">Register</a>
    </p>
  </div>

</body>
</html>
